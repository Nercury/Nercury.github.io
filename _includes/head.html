<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">

    <link rel="shortcut icon" type="image/png" href="/favicon.ico"/>
    <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/pygments/default.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/font-awesome.css" | prepend: site.baseurl }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles/color-brewer.css">

    <script src="/js/highlight.pack.js"></script>

    <script src="{{ "/js/jquery.min.js" | prepend: site.baseurl }}"></script>
    <script>
        $(function() {
            hljs.initHighlightingOnLoad();
            return $("h1, h2, h3, h4, h5, h6").each(function(i, el) {
                console.log(el);
                var $el, icon, id;
                $el = $(el);
                id = $el.attr('id');
                icon = '<i class="fa fa-link"></i>';
                if (id) {
                  return $el.prepend($("<a />").addClass("header-link").attr("href", "#" + id).html(icon));
                }
            });
        });
    </script>
</head>
