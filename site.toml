# Site settings (migrated from archive/_config.yml)
title = "Ironic Blog"
email = "nercury@gmail.com"
description = "Articles and tutorials about Rust, Embedded development and Computer Graphics.\n"
baseurl = ""
url = "http://nercury.github.io"
twitter_username = "nercury"
github_username = "Nercury"

# Color theme for highlighted code: a two-face embedded theme name (GitHub, OneHalfLight,
# InspiredGithub, SolarizedLight, ...). An unknown name makes the build list all of them.
syntax_theme = "GitHub"

# Build settings
# Paths (relative to the repository root) that are not part of the site. Names starting with
# `_`, `.`, `#` or ending with `~` are always skipped, like Jekyll does.
exclude = [
    "archive",
    "crates",
    "plans",
    "target",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "site.toml",
    "sitediff.allow.toml",
]
