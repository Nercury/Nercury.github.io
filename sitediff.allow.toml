# Differences between the Jekyll reference snapshot and the Rust generator output that are
# accepted on purpose. Everything not listed here fails `sitediff`.
#
#   [[file]]  path, reason                      ignore a file entirely
#   [[drop]]  path, selector, contains?, side?  remove matching elements before comparing HTML
#   [[line]]  path, pattern, side?              tolerate changed normalized lines matching a regex
#
# `path` is a glob over site-relative paths; `side` is "reference", "candidate" or "both" (default).

[[drop]]
path = "**/*.html"
selector = "script"
side = "reference"
reason = "D7 + Phase 8: Google Analytics dropped; highlight.js, jQuery and the heading-anchor script replaced by build-time rendering (the new site has no scripts at all)"

[[line]]
path = "feed.xml"
pattern = '^rss/channel/(pubDate|lastBuildDate):'
reason = "site build time"

[[line]]
path = "feed.xml"
pattern = '^rss/channel/generator:'
reason = "generator is no longer Jekyll"

[[line]]
path = "resources/mcu-02/cortex-m-basics.html"
pattern = '^\s*("GPIOB_CRL"|"a"|" are the MODE bits.*|"re the MODE bits.*|<code class="highlighter-rouge language-plaintext">)$'
reason = "source typo fixed: `GPIOB_CRL`` a`re -> `GPIOB_CRL` are (old build rendered a stray code span)"

[[line]]
path = "{feed.xml,rust/opengl/tutorial/2018/07/25/opengl-in-rust-from-scratch-12-buffers.html}"
pattern = '^\s*("\(src/render_gl/buffer\.rs, modified Buffer(<B>( struct\)|::new function\)))?"|<b>|" ?(struct\)|::new function\))")$'
reason = "source bug fixed: bare Buffer<B> in prose was rendered as an unclosed <b> tag; now escaped"

# ---------------------------------------------------------------------------------------------
# Phase 8: highlighting and heading anchors moved from the browser to the build.
# Code text, code block languages and everything outside code are still compared.
# ---------------------------------------------------------------------------------------------

[[drop]]
path = "**/*.html"
selector = 'link[href="/css/pygments/default.css"], link[href="/css/font-awesome.css"], link[href*="netdna.bootstrapcdn.com"], link[href="/css/styles/color-brewer.css"]'
side = "reference"
reason = "Phase 8: stylesheets for Rouge tokens, highlight.js and font-awesome are gone"

[[drop]]
path = "**/*.html"
selector = 'link[href="/css/syntax.css"]'
side = "candidate"
reason = "Phase 8: generated stylesheet for build-time syntax highlighting"

[[drop]]
path = "{**/*.html,feed.xml}"
selector = "a.header-link"
side = "candidate"
reason = "Phase 8: heading anchors are emitted at build time (jQuery used to inject them in the browser)"

[[line]]
path = "{**/*.html,feed.xml}"
pattern = '^\s*<code( class="highlighter-rouge language-plaintext")?>$'
reason = "Phase 8: inline code no longer carries Rouge's classes"

[[file]]
path = "css/main.css"
reason = "Phase 8: code block and anchor styles reworked (reviewed visually, not by diff)"

[[file]]
path = "css/syntax.css"
reason = "Phase 8: generated stylesheet for build-time syntax highlighting"

[[file]]
path = "{js/**,css/styles/**,css/pygments/**,css/font-awesome.css}"
reason = "Phase 8: highlight.js, jQuery, 75 unused highlight.js themes, pygments and font-awesome CSS removed"

# ---------------------------------------------------------------------------------------------
# Phase 9: cleanup. Deliberate content/config fixes relative to the 2020 snapshot.
# ---------------------------------------------------------------------------------------------

[[line]]
path = "**/*.html"
pattern = '^\s*<link href="https?://nercury\.github\.io/[^"]*" rel="canonical">$'
reason = "Phase 9: site.url is https now"

[[line]]
path = "feed.xml"
pattern = '^rss/channel/(link|atom:link@href|item\[\d+\]/link): "https?://nercury\.github\.io/'
reason = "Phase 9: site.url is https now (item guids deliberately stay http, so they are NOT covered here)"

[[line]]
path = "{feed.xml,rust/opengl/tutorial/2018/02/11/opengl-in-rust-from-scratch-04-triangle.html}"
pattern = '^\s*<a href="(docs\.gl|https://docs\.gl)">$'
reason = "Phase 9: broken relative link to docs.gl fixed"

[[line]]
path = "{feed.xml,rust/pointers/2014/10/30/rust-mem-transmute-and-void-pointers.html}"
pattern = '^\s*<a href="(https://gist\.github\.com/)?Nercury/ccc99ec11f49043c14ed">$'
reason = "Phase 9: broken relative link to the gist fixed"

[[line]]
path = "{feed.xml,rust/opengl/tutorial/2018/07/27/opengl-in-rust-from-scratch-13-safe-triangle-nalgebra.html}"
pattern = '^\s*"We can then use ‘?nalgebra’s "$'
reason = "Phase 9: stray opening quote before nalgebra removed"
